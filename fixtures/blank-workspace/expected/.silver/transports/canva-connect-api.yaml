# Canva Connect API — a declaration, not an adapter.
#
# A REST API, not an MCP server: no host configuration entry, generic
# executable/env detection instead. Good for producing a native, brandable
# presentation or asset from a template; not a general design-file tool.
schema: silver/provider/v1
id: canva-connect-api
version: 0.10.0
kind: external
target: canva
variant: connect-api
aliases:
  - canva
  - canva api
  - canva connect
source:
  publisher: Canva
  homepage: https://www.canva.com
  docs: https://www.canva.dev/docs/connect/
  distribution:
    kind: remote
    ref: https://api.canva.com/rest/v1
  evidence: declared
  verified_at: 2026-08-12
  verified_against: published documentation
guidance:
  good_at:
    - Producing a native, brandable presentation or visual asset from a Canva template
  not_for:
    - General design-file work or anything without a Canva account
  prefer_when:
    - The requested output is a Canva-native presentation or asset a stakeholder will edit in Canva
capabilities: [presentation-renderer, external-artifact]
interface:
  kind: api
  base_url: https://api.canva.com/rest/v1
  docs: https://www.canva.dev/docs/connect/
  detection:
    env: [CANVA_ACCESS_TOKEN]
activities:
  - id: presentation.render
    support: full
    actions: [create, write, update]
    outputs: [{format: canva, editable: true, native: true}]
permissions:
  - capability: presentation-renderer
    actions: [create, write, update]
    default: ask
  - capability: external-artifact
    actions: [create, write, update, publish]
    default: ask
requires_env: [CANVA_ACCESS_TOKEN]
directions: [read, write]
fidelity: semantic
maturity: stable
post_setup:
  - Requires a Canva Connect app and an OAuth access token — see the docs above for how to obtain one.
