# The browser your agent already has.
#
# Several agent hosts ship browser control as a built-in tool rather than an MCP
# server: there is nothing to install, nothing to declare in a config file, and
# no server name for Silver to look for. Without this, the only way to express
# "just use the browser you already have" would be to pretend it is an MCP
# server and then report it permanently missing.
#
# So availability here is honestly `unknown`. Silver cannot see the agent's own
# tool namespace; only the agent can confirm this exists, which is exactly what
# the probe is for. Bind it deliberately and it will be used.
schema: silver/provider/v1
id: agent-native-browser
version: 0.9.2
kind: external
target: browser
variant: host-native
aliases:
  - your agent's browser
  - built-in browser
  - the browser you already have
source:
  publisher: Whichever agent host you are running
  distribution:
    kind: host-native
    ref: Built into the agent, not installed separately
  evidence: declared
  verified_at: 2026-08-11
  verified_against: agent-host browser tooling in general
guidance:
  good_at:
    - Working with no setup at all when your agent already browses
  not_for:
    - Anything needing a guarantee — Silver cannot see whether your agent has this
  prefer_when:
    - Your agent has browser tools and you would rather not run a second server
  compare_to:
    - transport: chrome-devtools-mcp
      difference: >-
        Needs no installation or configuration, but Silver cannot verify it
        exists; the DevTools server is one Silver can at least confirm is declared.
capabilities: [browser]
connection:
  kind: host-native
browser_checks:
  adapter: delegated-observation
  execution_mode: delegated
  protocol_version: silver/browser-check-adapter/v1
  connection_kind: host-native
  checkers: [accessibility, responsive-behavior, critical-interactions]
  isolation: agent-owned
probe:
  tool: the agent's own browser or navigation tool
  expects: any successful page load
  freshness_hours: 24
permissions:
  - capability: browser
    actions: [inspect, execute]
    default: ask
directions: [read]
fidelity: partial
maturity: stable
post_setup:
  - Silver cannot see an agent's built-in tools. Ask the agent to open a page and record the result with `silver tools --record-probe`.
activities:
  - id: evaluate.run-browser-suite
    support: full
    actions: [inspect, execute]
  - id: browser.navigate
    support: full
    actions: [inspect, execute]
  - id: browser.interact
    support: full
    actions: [execute]
  - id: browser.inspect-structure
    support: partial
    actions: [inspect]
  - id: browser.capture-screenshot
    support: partial
    actions: [inspect]
