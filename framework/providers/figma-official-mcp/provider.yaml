# Figma's official MCP server — a read-oriented transport to Figma.
#
# Good at structured reads: pulling variables, styles, and design structure back
# out. It does not build frames, so it declares `directions: [read]` and is not
# a candidate for any push activity. That is the whole point of splitting Figma
# into transports — this one and figma-console-mcp are good at opposite jobs, and
# a designer can bind each activity to the right one.
#
# It needs no local build and no background process, so its setup ladder is one
# rung. That is why the default heuristic prefers it wherever it can serve.
schema: silver/provider/v1
id: figma-official-mcp
version: 0.8.0
kind: external
target: figma
variant: official
aliases:
  - official figma mcp
  - figma official
  - figma dev mode
source:
  publisher: Figma
  homepage: https://www.figma.com
  docs: https://help.figma.com/hc/en-us/articles/32132100833559
  distribution:
    kind: remote
    ref: https://mcp.figma.com/mcp
  # Declared from Figma's published endpoint. Nobody has exercised it here, and
  # saying so is the difference between a description and a claim.
  evidence: declared
  verified_at: 2026-08-11
  verified_against: published remote endpoint documentation
guidance:
  good_at:
    - Structured reads of variables, styles, and design structure
    - Pulling token values out of a file you do not have open
  not_for:
    - Creating or editing frames — it declares no write direction
  prefer_when:
    - You want design-system values back out of Figma without opening it
  compare_to:
    - transport: figma-console-mcp
      difference: >-
        Reads without needing the file open and needs no local plugin; the
        console transport can build in the document but requires it running.
capabilities: [design-file, representation-sync]
connection:
  kind: mcp
  server: figma
  tool_prefix: mcp__figma__
  # A remote endpoint: nothing to install and no process to supervise, which is
  # why the ladder below is two rungs and neither is a terminal.
  config:
    url: https://mcp.figma.com/mcp
availability:
  script: scripts/health.mjs
setup:
  - id: host-config
    kind: silver-managed
    title: Declare the figma MCP server in this agent host
    verify: { kind: host-mcp-entry, by: silver }
    troubleshoot:
      - symptom: Silver reports no MCP server named figma
        means: No host configuration file declares it yet.
        do: Run `silver tools --connect figma-official-mcp`, then restart your agent host.
  - id: authorize
    kind: external-app
    title: Authorize the connection when the host first calls it
    verify: { kind: handshake, by: agent }
    troubleshoot:
      - symptom: Configured, but calls come back unauthorized
        means: The remote endpoint has not been authorized for this machine.
        do: Ask the agent to call it once and complete the browser authorization it opens.
permissions:
  - capability: design-file
    actions: [read, inspect]
    default: ask
supported_artifact_kinds: [token-source, design-specification, component-proposal]
directions: [read]
fidelity: partial
probe:
  tool: mcp__figma__get_variable_defs
  expects: variable definitions from a Figma file, or an explicit empty result
  freshness_hours: 24
operations:
  - id: figma-official-health
    script: scripts/health.mjs
    effect: inspect
