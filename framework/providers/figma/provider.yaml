schema: silver/provider/v1
id: figma
version: 0.3.0
kind: external
capabilities: [design-file, external-artifact, representation-sync]
availability:
  script: scripts/health.mjs
permissions:
  - capability: design-file
    actions: [read, inspect]
    default: ask
  - capability: design-file
    actions: [write, update]
    default: ask
  - capability: external-artifact
    actions: [read, inspect, write, update]
    default: ask
supported_artifact_kinds: [flow, sketch, design-specification, component-proposal, token-source]
directions: [read, write-preview, write]
fidelity: partial
operations:
  - id: figma-health
    script: scripts/health.mjs
    effect: inspect
  - id: figma-snapshot
    script: adapter.mjs
    effect: read
  - id: figma-token-preview
    script: adapter.mjs
    effect: preview-write
adapter:
  id: silver-figma
  version: 0.3.0
  script: adapter.mjs
