schema: silver/skill/v2
id: flow
version: 0.9.1
summary: Create and revise portable, revision-aware behavior graphs.
context_budget: medium
inputs:
  - kind: design-specification
    required: false
    role: working
  - kind: concept
    required: false
    role: working
  - kind: structure
    required: false
    role: working
  - kind: product
    required: false
    role: canonical
  - kind: component-proposal
    required: false
    role: working
outputs:
  - kind: flow
    scope: product
    path_pattern: design/flows/**
    authority: project-owned
  - kind: flow
    scope: prototype
    path_pattern: prototypes/**/flows/**
    authority: project-owned
capabilities:
  required:
    - repository
    - flow
  optional:
    - capability: design-file
      providers: []
      fallback: degraded
      description: Use design-file when configured; preserve explicit fallback
        coverage otherwise.
effects:
  - capability: repository
    actions:
      - read
      - inspect
    paths:
      - design/**
      - prototypes/**
      - presentations/**
      - production/**
      - .silver/**
  - capability: repository
    actions:
      - create
      - write
      - update
    paths:
      - design/flows/**
  - capability: repository
    actions:
      - create
      - write
      - update
    paths:
      - prototypes/**/flows/**
  - capability: design-file
    actions:
      - read
      - inspect
      - write
      - update
    external: true
guardrails:
  - authority-respected
  - effects-declared
  - no-silent-mutation
  - revision-pinned
  - followups-recommended-only
  - provenance-required
completion:
  invariants:
    - stable-node-identities
    - outcomes-reachable
    - states-covered
  quality_criteria:
    - id: task-quality
      description: The graph exposes decisions, alternate outcomes, system actions,
        and missing states without depending on one renderer.
      evaluation: human
  unresolved_questions: block-handoff
  review:
    required: true
    reviewer: human
    checkpoint: Review and accept the result before a readiness-gated handoff.
checks:
  - id: flow-structure
    required: true
    blocks: &a1
      - visualize
      - prototype
      - component
      - implement
  - id: contract-integrity
    required: true
    blocks: *a1
handoffs:
  - id: flow-to-visualize
    target: visualize
    readiness: visualize
    requires:
      - flow
      - flow
  - id: flow-to-prototype
    target: prototype
    readiness: prototype
    requires:
      - flow
      - flow
  - id: flow-to-component
    target: component
    readiness: component
    requires:
      - flow
      - flow
  - id: flow-to-implement
    target: implement
    readiness: production
    requires:
      - flow
      - flow
external_effects:
  - none
scripts:
  - id: invoke
    path: scripts/invoke.mjs
    purpose: Run this skill through the shared guarded invocation runtime.
  - id: check-flow
    path: scripts/check-flow.mjs
    purpose: Bundled deterministic flow operation.
  - id: flow-lib
    path: scripts/flow-lib.mjs
    purpose: Bundled deterministic flow operation.
  - id: init-flow
    path: scripts/init-flow.mjs
    purpose: Bundled deterministic flow operation.
  - id: render-flow
    path: scripts/render-flow.mjs
    purpose: Bundled deterministic flow operation.
recommend_after: *a1
