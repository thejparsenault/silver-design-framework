schema: silver/skill/v2
id: product
version: 0.5.0
summary: Define or refine product audience, jobs, outcomes, and positioning.
context_budget: small
inputs:
  - kind: brand
    required: false
    role: canonical
  - kind: product
    required: false
    role: canonical
outputs:
  - kind: product
    scope: product
    path_pattern: design/product.md
    authority: canonical-with-approval
  - kind: decision
    scope: product
    path_pattern: design/decisions/**
    authority: project-owned
capabilities:
  required:
    - repository
    - canonical-artifact
  optional: []
effects:
  - capability: repository
    actions:
      - read
      - inspect
    paths:
      - design/**
      - prototypes/**
      - presentations/**
      - production/**
      - reference-system/**
      - .silver/**
  - capability: canonical-artifact
    actions:
      - create
      - write
      - update
    paths:
      - design/product.md
  - capability: repository
    actions:
      - create
      - write
      - update
    paths:
      - design/decisions/**
guardrails:
  - authority-respected
  - effects-declared
  - no-silent-mutation
  - revision-pinned
  - followups-recommended-only
completion:
  invariants:
    - audience-specific
    - jobs-observable
    - outcomes-distinct-from-features
  quality_criteria:
    - id: task-quality
      description: Product guidance distinguishes audience, job, outcome, constraint,
        and positioning.
      evaluation: human
  unresolved_questions: block-handoff
  review:
    required: true
    reviewer: human
    checkpoint: Review and accept the result before a readiness-gated handoff.
checks:
  - id: contract-integrity
    required: true
    blocks: &a1
      - brand
      - voice
      - synthesize
  - id: evidence-provenance
    required: true
    blocks: *a1
handoffs:
  - id: product-to-brand
    target: brand
    readiness: brand
    requires:
      - product
      - decision
  - id: product-to-voice
    target: voice
    readiness: voice
    requires:
      - product
      - decision
  - id: product-to-synthesize
    target: synthesize
    readiness: synthesize
    requires:
      - product
      - decision
external_effects:
  - none
scripts:
  - id: invoke
    path: scripts/invoke.mjs
    purpose: Run this skill through the shared guarded invocation runtime.
recommend_after: *a1
