schema: silver/skill/v2
id: research
version: 0.8.0
summary: Plan ethical research and sanitized evidence handling.
context_budget: small
inputs:
  - kind: product
    required: false
    role: canonical
  - kind: problem-frame
    required: false
    role: working
  - kind: design-specification
    required: false
    role: working
outputs:
  - kind: research-plan
    scope: product
    path_pattern: design/research/**
    authority: project-owned
capabilities:
  required:
    - repository
  optional:
    - capability: research-evidence
      providers: []
      fallback: degraded
      description: Use research-evidence when configured; preserve explicit fallback
        coverage otherwise.
effects:
  - capability: repository
    actions:
      - read
      - inspect
    paths:
      - design/**
      - prototypes/**
      - presentations/**
      - production/**
      - reference-system/**
      - .silver/**
  - capability: repository
    actions:
      - create
      - write
      - update
    paths:
      - design/research/**
  - capability: research-evidence
    actions:
      - read
      - inspect
      - search
    external: true
guardrails:
  - authority-respected
  - effects-declared
  - no-silent-mutation
  - revision-pinned
  - followups-recommended-only
  - privacy-sanitized-evidence
  - no-fabricated-evidence
  - provenance-required
completion:
  invariants:
    - question-method-aligned
    - participant-criteria-explicit
    - planned-not-conducted
  quality_criteria:
    - id: task-quality
      description: The plan can answer the declared question while minimizing
        sensitive data collection.
      evaluation: human
  unresolved_questions: warn
  review:
    required: true
    reviewer: human
    checkpoint: Review and accept the result before a readiness-gated handoff.
checks:
  - id: contract-integrity
    required: true
    blocks: &a1
      - evaluate
      - synthesize
      - collect
  - id: evidence-provenance
    required: true
    blocks: *a1
handoffs:
  - id: research-to-evaluate
    target: evaluate
    readiness: evaluate
    requires:
      - research-plan
  - id: research-to-synthesize
    target: synthesize
    readiness: synthesize
    requires:
      - research-plan
  - id: research-to-collect
    target: collect
    readiness: collect
    requires:
      - research-plan
external_effects:
  - none
scripts:
  - id: invoke
    path: scripts/invoke.mjs
    purpose: Run this skill through the shared guarded invocation runtime.
recommend_after: *a1
