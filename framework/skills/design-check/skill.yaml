schema: design-practice/skill/v1
id: design-check
version: 0.1.0-alpha.1
summary: Run independent design checks and summarize normalized findings.
context_budget: small
requires:
  artifacts:
    - kind: check-config
      required: false
      role: canonical
    - kind: design-system
      required: true
      role: canonical
    - kind: flow
      required: false
  capabilities:
    - repository
    - browser
access:
  read:
    - scope: product
      paths:
        - design/**
        - reference-system/**
    - scope: prototype
      paths:
        - prototypes/**
    - scope: codebase
      paths:
        - .design-framework/**
  write: []
produces: []
external_effects:
  - read-external
requested_permissions:
  - capability: repository
    actions:
      - read
    paths:
      - design/**
      - reference-system/**
      - prototypes/**
      - .design-framework/**
  - capability: browser
    actions:
      - inspect
scripts:
  - id: check-artifacts
    path: scripts/check-artifacts.mjs
    purpose: Validate the manifest, canonical artifact mappings, and artifact metadata.
  - id: check-flows
    path: scripts/check-flows.mjs
    purpose: Validate portable flow contracts, references, reachability, decisions, and outcomes.
  - id: check-semantic-styles
    path: scripts/check-semantic-styles.mjs
    purpose: Reject raw color and fixed-dimension values outside approved token outputs.
  - id: check-prototypes
    path: scripts/check-prototypes.mjs
    purpose: Validate explicit prototype constraint profiles and pinned flow revisions.
  - id: run-fast
    path: scripts/run-fast.mjs
    purpose: Run all bundled static checkers independently and preserve each normalized result.
recommend_after: []
