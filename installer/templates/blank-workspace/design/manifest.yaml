schema: silver/manifest/v1
workspace:
  id: {{WORKSPACE_ID}}
  name: {{WORKSPACE_NAME}}
  scope: product-workspace
  description: {{WORKSPACE_DESCRIPTION}}

artifacts:
  - id: brand
    kind: brand
    path: design/brand.md
    scope: product
    role: canonical
    status: draft
    authority:
      type: local
  - id: product
    kind: product
    path: design/product.md
    scope: product
    role: canonical
    status: draft
    authority:
      type: local
  - id: voice
    kind: voice
    path: design/voice.md
    scope: product
    role: canonical
    status: draft
    authority:
      type: local
  - id: design-principles
    kind: design-principles
    path: design/design-principles.md
    scope: product
    role: canonical
    status: draft
    authority:
      type: local
  - id: design-system
    kind: design-system
    path: design/system/README.md
    scope: product
    role: canonical
    status: draft
    authority:
      type: local
  - id: component-catalog
    kind: component-catalog
    path: design/system/components.json
    scope: product
    role: canonical
    status: active
    authority:
      type: local
  - id: design-system-tokens
    kind: token-source
    path: design/system/tokens.json
    scope: product
    role: canonical
    status: active
    authority:
      type: local
  - id: default-component-expression
    kind: x-component-expression
    path: design/contexts/default-expression.yaml
    scope: product
    role: canonical
    status: active
    authority:
      type: local
  - id: default-design-context
    kind: x-design-context
    path: design/contexts/default.yaml
    scope: product
    role: canonical
    status: active
    authority:
      type: local
  - id: guidance-sources
    kind: x-guidance-source
    path: design/guidance/sources.yaml
    scope: product
    role: supporting
    status: active
    authority:
      type: local
  - id: linked-sources
    kind: x-linked-source
    path: design/sources/sources.yaml
    scope: product
    role: supporting
    status: active
    authority:
      type: local
  - id: decisions
    kind: decision-log
    path: design/decisions/README.md
    scope: product
    role: canonical
    status: active
    authority:
      type: local
  - id: project-assets
    kind: asset-catalog
    path: design/assets/catalog.json
    scope: product
    role: canonical
    status: active
    authority:
      type: local
  - id: presentation-kit
    kind: presentation-kit
    path: design/presentation-kit/kit.json
    scope: product
    role: canonical
    status: active
    authority:
      type: local

implementation_profiles:
  default-html:
    recipe: static-html
    status: offered
    root: design/system
    commands:
      preview: python3 -m http.server 4173 --directory design/system
    adapters:
      - vanilla-css

flow_policy:
  roots:
    - design/flows
  default_view: mermaid
  require_revision_links: true

prototype_policy:
  roots:
    - prototypes
  default_profile: constrained
  allowed_profiles:
    - constrained
    - partial
    - suspended
  explicit_override_required: true
  baseline_checks:
    - accessibility
    - prototype-policy

checks:
  policy_profile: prototype
  enabled:
    - contract-integrity
    - flow-structure
    - map-structure
    - semantic-styles
    - prototype-policy
    - accessibility
    - responsive-behavior
    - evidence-provenance
    - presentation-integrity
    - production-readiness
    - asset-integrity
    - critical-interactions
    - binding-integrity
    - provider-revision-pins
    - view-provenance
    - synchronization-status
    - semantic-mapping
    - stale-proposals
    - authority
    - secret-free-configuration
  suites:
    fast:
      - contract-integrity
      - flow-structure
      - map-structure
      - semantic-styles
      - prototype-policy
      - evidence-provenance
      - presentation-integrity
      - production-readiness
      - asset-integrity
      - accessibility
      - responsive-behavior
      - critical-interactions
      - binding-integrity
      - provider-revision-pins
      - view-provenance
      - synchronization-status
      - semantic-mapping
      - stale-proposals
      - authority
      - secret-free-configuration
    browser:
      - accessibility
      - responsive-behavior
      - critical-interactions
      - binding-integrity
      - provider-revision-pins
      - view-provenance
      - synchronization-status
      - semantic-mapping
      - stale-proposals
      - authority
      - secret-free-configuration
    full:
      - contract-integrity
      - flow-structure
      - map-structure
      - semantic-styles
      - prototype-policy
      - evidence-provenance
      - presentation-integrity
      - production-readiness
      - asset-integrity
      - accessibility
      - responsive-behavior
      - critical-interactions
  render_targets:
    - id: default-system
      profile: default-html
      path: /showcase.html
      start: python3 -m http.server 4173 --directory design/system
      viewports:
        - width: 375
          height: 812
        - width: 1440
          height: 900
