<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Design Practice Reference System</title>
  <!--
    Run `npm run build:reference` from the framework repository before
    previewing this example.
  -->
  <link rel="stylesheet" href="../../packages/css/src/ds.css" />
  <link rel="stylesheet" href="./login-form.css" />
</head>
<body data-scheme="light" data-mode="default">

  <main class="reference-login-page">
    <div class="reference-login-panel">

      <header class="reference-login-header">
        <h1 class="reference-login-title">Sign in</h1>
        <p class="reference-login-lede">Welcome back. Enter your credentials to continue.</p>
      </header>

      <form method="post" action="/login" novalidate>

        <div class="ds-field">
          <label class="ds-field-label" for="email" data-required>Email address</label>
          <input
            class="ds-input"
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            aria-required="true"
            placeholder="you@company.com"
          />
        </div>

        <div class="ds-field">
          <label class="ds-field-label" for="password" data-required>Password</label>
          <input
            class="ds-input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            aria-required="true"
          />
          <p class="ds-field-hint">
            <a href="/forgot-password">Forgot your password?</a>
          </p>
        </div>

        <div class="reference-login-actions">
          <button class="ds-button" data-variant="primary" data-layout="full-width" type="submit">
            Sign in
          </button>
          <button class="ds-button" data-variant="ghost" data-layout="full-width" type="button">
            Continue with SSO
          </button>
        </div>

      </form>

      <p class="reference-login-footer">
        Don't have an account? <a href="/signup">Create one</a>
      </p>

    </div>
  </main>

  <!-- Dark mode toggle demo — scheme switching via attribute -->
  <div class="reference-scheme-controls" aria-label="Color scheme">
    <button
      class="ds-button"
      data-variant="secondary"
      data-size="sm"
      type="button"
      onclick="document.body.setAttribute('data-scheme', 'light')"
    >Light</button>
    <button
      class="ds-button"
      data-variant="secondary"
      data-size="sm"
      type="button"
      onclick="document.body.setAttribute('data-scheme', 'dark')"
    >Dark</button>
  </div>

</body>
</html>
