name: Compatibility

on:
  push:
  pull_request:

jobs:
  filesystem-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest] #, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:contracts
      - name: Filesystem, recovery, and synchronization evidence
        run: >-
          node --test --test-timeout=120000 --test-concurrency=1
          framework/tests/workspace-mutations.test.mjs
          framework/tests/workspace-transactions.test.mjs
          installer/tests/workspace-safety.test.mjs
          installer/tests/sync-link.test.mjs
          installer/tests/sync-repository.test.mjs
          installer/tests/sync-figma.test.mjs
      - run: npm run test:package

  current-node-linux:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
