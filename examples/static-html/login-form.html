<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Foundation DS Phase 0 Example</title>
  <!--
    After running `npm run build`, ds.css is generated at packages/css/src/tokens.css
    and the full bundle at packages/css/src/ds.css.
    For now this file demonstrates the intended HTML contract structure.
  -->
  <link rel="stylesheet" href="../../packages/css/src/ds.css" />
</head>
<body data-scheme="light" data-mode="default">

  <main style="min-height: 100dvh; display: grid; place-items: center; padding: 2rem;">
    <div style="width: 100%; max-width: 24rem;">

      <header style="margin-bottom: 2rem;">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Sign in</h1>
        <p style="font-size: 0.9rem;">Welcome back. Enter your credentials to continue.</p>
      </header>

      <form method="post" action="/login" novalidate>

        <div class="ds-field">
          <label class="ds-field-label" for="email" data-required>Email address</label>
          <input
            class="ds-input"
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            aria-required="true"
            placeholder="you@company.com"
          />
        </div>

        <div class="ds-field">
          <label class="ds-field-label" for="password" data-required>Password</label>
          <input
            class="ds-input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            aria-required="true"
          />
          <p class="ds-field-hint">
            <a href="/forgot-password">Forgot your password?</a>
          </p>
        </div>

        <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
          <button class="ds-button" data-variant="primary" data-layout="full-width" type="submit">
            Sign in
          </button>
          <button class="ds-button" data-variant="ghost" data-layout="full-width" type="button">
            Continue with SSO
          </button>
        </div>

      </form>

      <p style="margin-top: 1.5rem; font-size: 0.85rem; text-align: center;">
        Don't have an account? <a href="/signup">Create one</a>
      </p>

    </div>
  </main>

  <!-- Dark mode toggle demo — scheme switching via attribute -->
  <div style="position: fixed; bottom: 1rem; right: 1rem; display: flex; gap: 0.5rem;">
    <button
      class="ds-button"
      data-variant="secondary"
      data-size="sm"
      type="button"
      onclick="document.body.setAttribute('data-scheme', 'light')"
    >Light</button>
    <button
      class="ds-button"
      data-variant="secondary"
      data-size="sm"
      type="button"
      onclick="document.body.setAttribute('data-scheme', 'dark')"
    >Dark</button>
  </div>

</body>
</html>
